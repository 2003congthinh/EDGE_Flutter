name: operator_pass
description: "Operator Pass: offline face ID for people who work alongside robots."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.3
  permission_handler: ^11.3.0
  tflite_flutter: ^0.12.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Models are loaded from here at launch (see README "Models").
  #   face_detector.tflite  - YOLO face detector (required)
  #   face_embedder.tflite  - face embedding model, e.g. MobileFaceNet (optional;
  #                           without it a placeholder matcher is used for testing)
  assets:
    - assets/models/
